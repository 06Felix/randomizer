name: Release

on:
  push:
    tags:
      - "v*" # trigger only on version tags

permissions:
  contents: write # required to create GitHub releases
  pull-requests: read
  issues: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify tag matches package version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match Cargo.toml version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --check

      - name: Test Java DTO exporter
        run: mvn --batch-mode --file tools/java-dto-exporter/pom.xml test

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets --locked

  build:
    name: Build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          # Linux
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            bin: randomizer

          # Windows (MSVC - FIXED)
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            bin: randomizer.exe

          # macOS (Apple Silicon)
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            bin: randomizer

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # IMPORTANT for git-cliff

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # ✅ Native build (NO cross)
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # ✅ Package (cross-platform safe)
      - name: Package
        shell: bash
        run: |
          APP_NAME="randomizer"
          VERSION=${GITHUB_REF#refs/tags/}

          mkdir -p dist

          BIN_PATH="target/${{ matrix.target }}/release/${{ matrix.bin }}"

          if [ ! -f "$BIN_PATH" ]; then
            echo "Binary not found: $BIN_PATH"
            exit 1
          fi

          # Strip (safe fallback)
          strip "$BIN_PATH" 2>/dev/null || true

          cp "$BIN_PATH" dist/

          if [ "${{ matrix.archive }}" = "zip" ]; then
            # Windows runner supports zip
            powershell -Command "Compress-Archive -Path dist/* -DestinationPath $APP_NAME-$VERSION-${{ matrix.target }}.zip"
          else
            tar -czf "$APP_NAME-$VERSION-${{ matrix.target }}.tar.gz" -C dist .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            *.tar.gz
            *.zip

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate changelog (git-cliff)
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.content }}
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
