[package]
name = "randomizer"
version = "1.1.0"
edition = "2024"
authors = ["rangaraja-r", "mark-felix"]

[dependencies]

# --- Async runtime ---
tokio = { version = "1", features = ["full"] }

# --- Web framework (REST + WebSocket) ---
axum = { version = "0.8", features = ["ws"] }
bytes = "1"

# --- JSON parsing ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Random generation ---
rand = "0.10"
rand_regex = "0.19"
sha2 = "0.10"

# --- Error handling ---
thiserror = "2"
jsonschema = { version = "0.49.4", default-features = false }

# --- Logging / debugging ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
uuid = "1.23.0"


[dev-dependencies]
# --- git hooks ---
cargo-husky = "1"
futures-util = "0.3"
proptest = "1"
tokio-tungstenite = "0.28"
tower = { version = "0.5", features = ["util"] }
